[package]
name = "si-conservation-python"
version = "0.1.0"
edition = "2021"
description = "Python bindings for SuperInstance conservation law — gamma + eta = total_budget via PyO3"
license = "MIT"
repository = "https://github.com/SuperInstance/si-conservation-python"

[lib]
name = "si_conservation"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
